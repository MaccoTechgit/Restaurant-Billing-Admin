<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order from your table</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/theme.css">
<style>
body{padding-bottom:90px}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.hd{background:linear-gradient(135deg,var(--pri),#9a3412);color:#fff;padding:22px 16px 20px;border-radius:0 0 26px 26px;margin:-12px -12px 12px;text-align:center;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(154,52,18,.35)}
.hd::before{content:"";position:absolute;right:-50px;top:-60px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12)}
.hd .lg{width:74px;height:74px;border-radius:50%;background:#fff;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.28);font-size:36px;position:relative}
.hd .lg img{width:100%;height:100%;object-fit:cover}
.hd .pill{display:inline-block;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);border-radius:99px;padding:3px 14px;font-weight:800;margin-top:8px;backdrop-filter:blur(6px)}
.hd h1{font-size:21px}.hd p{margin:4px 0 0;opacity:.92;font-size:14px}
.it{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.it .e{font-size:30px;width:44px;text-align:center}.it .m{flex:1}.it .m small{color:var(--mut)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center}
.bar .btn{flex:1;justify-content:center}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading menu…</div></div>
<div id="toast"></div><div id="modal"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T=new URLSearchParams(location.search).get('t')||'';
let D=null,cart=[],cat=0,placed=JSON.parse(localStorage.getItem('qr_'+T)||'null');
const money=v=>{const c=D.currency;const s=((v||0)/100).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});return c.position==='after'?s+' '+c.symbol:c.symbol+s};
function toast(m,bad){const d=document.createElement('div');d.textContent=m;if(bad)d.className='bad';$('#toast').append(d);setTimeout(()=>d.remove(),3500)}
async function j(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Something went wrong');return d}
async function init(){
  try{D=await j('/api/public/qr?t='+encodeURIComponent(T))}catch(e){$('#app').innerHTML='<div class="card empty">'+esc(e.message)+'</div>';return}
  if(D.color)document.documentElement.style.setProperty('--pri',D.color);
  document.title=D.restaurant; draw(); if(placed) track();
}
function total(){return cart.reduce((a,l)=>a+l.unit*l.qty,0)}
function draw(){
  const m=D.menu,cats=m.categories;
  $('#app').innerHTML=`<div class="hd"><div class="lg">${D.logo&&/^(\/media\/|https?:\/\/)/i.test(D.logo)?`<img src="${esc(D.logo)}" alt="">`:'🍴'}</div><h1>${esc(D.restaurant)}</h1>${D.tagline?`<p>${esc(D.tagline)}</p>`:''}<div class="pill">${esc(D.branch)} · Table ${esc(D.table)}</div><p style="margin-top:8px;font-size:13px">${esc(D.welcome)}</p></div>
   ${placed?'<div id="trk"></div>':''}
   <div class="tabs" style="overflow:auto;flex-wrap:nowrap;padding:4px 0"><button class="tab ${!cat?'on':''}" data-c="0">All</button>${cats.map(c=>`<button class="tab ${cat===c.id?'on':''}" data-c="${c.id}" style="flex:none">${c.emoji||''} ${esc(c.name)}</button>`).join('')}</div>
   <div class="card" style="padding:4px 14px;margin-top:8px">${m.products.filter(p=>p.available&&(!cat||p.category===cat)).map(p=>`<div class="it"><div class="e">${p.image?`<img src="${esc(p.image)}" style="width:44px;height:44px;border-radius:8px;object-fit:cover">`:(p.emoji||'🍽')}</div><div class="m"><b>${esc(p.name)}</b><br><small>${esc(p.desc||'')}</small><div style="font-weight:800;color:var(--pri-d)">${money(p.price)}</div></div><button class="btn pri sm" data-p="${p.id}">Add</button></div>`).join('')||'<div class="empty">Nothing here</div>'}</div>
   ${D.call_waiter?'<div style="text-align:center;margin:14px"><button class="btn" id="call">🔔 Call a waiter</button></div>':''}
   <div class="bar"><div><small class="muted">${cart.reduce((a,l)=>a+l.qty,0)} items</small><div style="font-weight:800;font-size:18px">${money(total())}</div></div><button class="btn pri lg" id="rev" ${cart.length?'':'disabled'}>View order</button></div>`;
  $$('[data-c]').forEach(b=>b.onclick=()=>{cat=+b.dataset.c;draw()});
  $$('[data-p]').forEach(b=>b.onclick=()=>add(m.products.find(p=>p.id===+b.dataset.p)));
  $('#rev').onclick=review;
  if($('#call'))$('#call').onclick=async()=>{try{await j('/api/public/qr/call',{t:T});toast('A waiter is on the way 🙋')}catch(e){toast(e.message,true)}};
}
function add(p){
  const opts=(p.options||[]).map(id=>D.menu.options.find(o=>o.id===id)).filter(Boolean);
  if(!opts.length){push(p,[],1,'');return}
  $('#modal').innerHTML=`<div class="modal"><div class="box"><h2>${esc(p.name)}</h2>${opts.map(o=>`<label class="f">${esc(o.name)}${o.required?' *':''}</label><div class="multi" style="max-height:none">${o.choices.map(c=>`<label><input type="${o.kind==='multiple'?'checkbox':'radio'}" name="o${o.id}" data-o="${o.id}" value="${esc(c.name)}" data-pr="${c.price}"> ${esc(c.name)} ${c.price?'<small class="muted">+'+money(c.price)+'</small>':''}</label>`).join('')}</div>`).join('')}<label class="f">Note</label><input id="nt" placeholder="e.g. less spicy"><div class="acts"><button class="btn" id="x">Cancel</button><button class="btn pri" id="a">Add</button></div></div></div>`;
  $('#x').onclick=()=>$('#modal').innerHTML='';
  $('#a').onclick=()=>{const ch=$$('input[data-o]:checked').map(i=>({option:+i.dataset.o,choice:i.value,price:+i.dataset.pr}));const miss=opts.find(o=>o.required&&!ch.some(c=>c.option===o.id));if(miss)return toast('Please choose '+miss.name,true);$('#modal').innerHTML='';push(p,ch,1,$('#nt').value)};
}
function push(p,ch,qty,note){const unit=p.price+ch.reduce((a,c)=>a+c.price,0),key=p.id+ch.map(c=>c.option+c.choice).join()+note;const e=cart.find(l=>l.key===key);if(e)e.qty+=qty;else cart.push({key,p,unit,qty,ch,note});toast(p.name+' added');draw()}
function review(){
  $('#modal').innerHTML=`<div class="modal"><div class="box"><h2>Your order</h2>${cart.map((l,i)=>`<div class="row"><span><b>${esc(l.p.name)}</b>${l.ch.length?'<br><small class="muted">'+esc(l.ch.map(c=>c.choice).join(', '))+'</small>':''}${l.note?'<br><small class="muted">📝 '+esc(l.note)+'</small>':''}</span><span class="qty" style="display:flex;gap:6px;align-items:center"><button class="btn sm" data-m="${i}">−</button><b>${l.qty}</b><button class="btn sm" data-a="${i}">+</button></span></div>`).join('')}<div class="row"><b>Total (before tax)</b><b>${money(total())}</b></div>
   <label class="f">Your name (optional)</label><input id="nm"><label class="f">Phone ${D.require_phone?'*':'(optional)'}</label><input id="ph" type="tel"><label class="f">Note for the kitchen</label><input id="on"><div class="err inline hide" id="er"></div><div class="acts"><button class="btn" id="x">Back</button><button class="btn pri lg" id="go">Place order</button></div></div></div>`;
  $$('[data-m]').forEach(b=>b.onclick=()=>{const l=cart[+b.dataset.m];l.qty--;if(l.qty<1)cart.splice(+b.dataset.m,1);cart.length?review():($('#modal').innerHTML=''),draw()});
  $$('[data-a]').forEach(b=>b.onclick=()=>{cart[+b.dataset.a].qty++;review();draw()});
  $('#x').onclick=()=>$('#modal').innerHTML='';
  $('#go').onclick=async()=>{
    $('#go').disabled=true;
    try{const r=await j('/api/public/qr/order',{t:T,name:$('#nm').value,phone:$('#ph').value,note:$('#on').value,items:cart.map(l=>({product_id:l.p.id,qty:l.qty,note:l.note,options:l.ch.map(c=>({option:c.option,choice:c.choice}))}))});
      placed=r;localStorage.setItem('qr_'+T,JSON.stringify(r));cart=[];$('#modal').innerHTML='';toast(r.status==='held'?'Order sent - waiting for staff to confirm':'Order sent to the kitchen ✔');draw();track()}
    catch(e){$('#er').textContent=e.message;$('#er').classList.remove('hide');$('#go').disabled=false}
  };
}
let tt=null;
async function track(){
  clearTimeout(tt);
  try{const o=await j('/api/public/qr/order?t='+encodeURIComponent(T)+'&id='+placed.id);
    const el=$('#trk');if(el)el.innerHTML=`<div class="card" style="margin-bottom:10px"><b>Your order ${esc(o.no)}</b> <span class="chip ${o.status}">${esc(o.status.replace('_',' '))}</span>${o.items.map(i=>`<div class="row"><span>${i.qty} × ${esc(i.name)}</span><span class="chip ${i.status}">${esc(i.status)}</span></div>`).join('')}<small class="muted">Total ${money(o.total)} · pay at the counter or to your waiter</small></div>`;
    if(!['completed','cancelled','refunded'].includes(o.status))tt=setTimeout(track,6000);
  }catch(e){localStorage.removeItem('qr_'+T);placed=null}
}
init();
</script>
</body>
</html>
