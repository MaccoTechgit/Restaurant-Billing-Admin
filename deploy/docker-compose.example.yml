# Example: frontend + backend side by side. Copy, adjust and run:  docker compose -f deploy/docker-compose.example.yml up --build
# The backend lives in its own repository - build or pull its image and put it here.
services:
  backend:
    image: restaurant-billing-backend:latest      # build from the backend repository
    environment:
      ADMIN_PASSWORD: change-me
      JWT_SECRET: change-me-to-a-long-random-text-of-32-or-more-characters
      TRUST_PROXY: "1"
      DB_PATH: /data/tablebill.db
    volumes: ["backend-data:/data"]
    expose: ["8080"]

  frontend:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      BACKEND_URL: http://backend:8080
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  backend-data: {}
